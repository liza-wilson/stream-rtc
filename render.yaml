services:
  - type: web
    name: streamrtc
    runtime: node
    plan: starter
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && node dist/combined/main.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.22.1
      - key: STREAMRTC_CONFIG_FILE
        value: /etc/secrets/streamrtc.config.json
      - key: PUBLIC_RELAY_URL
        sync: false
